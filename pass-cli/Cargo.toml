[package]
name = "pass-cli"
version = "2.6.0"
edition = "2024"

[dependencies]
pass = { path = "../pass", features = ["tokio-runtime"] }
pass-db = { path = "../pass-db" }
pass-fs = { path = "../pass-fs" }

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
dirs = "7.0"
ed25519-dalek = "3"
fluent-uri = "0.4"
futures-util = "0.3"
handlebars = "6.3.2"
hex = "0.4"
keyring-core = "1.0.0"
open = "5.3.2"
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
p521 = { version = "0.14", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rpassword = "7.3.1"
rsa = "0.9"
semver = "1.0"
sha1 = "0.10"
sha2 = "0.10"
ssh-agent-client-rs = "1.1.2"
ssh-agent-lib = { git = "https://github.com/wiktor-k/ssh-agent-lib.git", rev = "3114e4ee3cbe1f3e2ea187f70b82372789da0fef" }
ssh-key = { version = "0.6.7", features = ["crypto", "ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
tracing-subscriber = { version = "0.3", features = ["default"] }
urlencoding = "2.1"
zeroize.workspace = true
zeroizing-alloc = "0.1.1"

anyhow.workspace = true
base64.workspace = true
async-trait.workspace = true
jiff.workspace = true
futures.workspace = true
muon = { workspace = true, features = ["transport-hyper"] }
parking_lot.workspace = true
proton-pass-common.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile = { workspace = true, optional = true}
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31.3", features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
zip = "9.1.2"
windows-native-keyring-store = "1.0.0"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
internal = ["tempfile", "pass/internal"]
no-login-restriction = []
