[workspace]
members = ["pass", "pass-*"]
# Python package only (maturin builds pass-mobile-sdk), it has no Cargo.toml
exclude = ["pass-python-sdk"]
default-members = [
    "pass-cli",
    "pass-db",
    "pass-fs",
    "pass",
    "pass-derive",
    # maturin runs its `uniffi-bindgen` bin (in the default members) to generate the Python bindings
    "pass-uniffi-bindgen"
]
resolver = "2"

[workspace.dependencies]
muon = { version = "5.0.1", registry = "proton", features = ["full-base", "unsealed", "other-platform"] }
muon-test = { version = "5.0.0", registry = "proton" }
proton-crypto = { version = "0.14.0", registry = "proton", default-features = false, features = ["rustpgp"] }
proton-crypto-account = { version = "0.20.0", registry = "proton", default-features = false, features = ["rustpgp"] }

proton-pass-common = {  git = "https://github.com/protonpass/proton-pass-common.git", tag = "2.1.1" }
proton-pass-types = { git = "https://github.com/protonpass/proton-pass-common.git", tag = "2.1.1", features = ["serde"] }

aes-gcm = "0.11"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3"
jiff = { version = "0.2.37", features = ["serde"] }
parking_lot = "0.13"
protobuf = "3.7.2"
protobuf-codegen = "3.7.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
tracing = "0.1"
uniffi = "0.32"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.26", features = ["v4", "js"] }
zeroize = { version = "1.9", features = ["derive"] }
